name: Test Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*a[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*b[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*rc[0-9]*'

permissions:
  contents: read  # the default for every job; the jobs that publish set their own permissions

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/tests.yaml  # the full tests: every system and Python version, lint, package and Docker

  publish-docker-image:
    name: Publish Docker Image
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU  # emulates arm64 while building, so this amd64 runner also builds the arm64 image
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx  # initializes BuildKit engine required for gha cache backend
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.description=MCP server with weather forecasts, measurements, snow, the avalanche bulletin and sun and moon times for Switzerland

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64  # arm64 for Apple silicon Macs and Arm servers
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
          cache-from: type=gha  # pulls previous layers and uv cache from GitHub to speed up the build
          cache-to: type=gha,mode=max  # exports new layers and uv cache to GitHub for subsequent runs

  build:
    name: Build Distribution
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.ref_name }}  # the pushed tag is the version, whatever other tags share its commit
      - name: Store Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/swiss-weather-mcp
    permissions:
      id-token: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  validate-mcp-registry-server-json:
    name: Validate MCP Registry server.json
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set Version in server.json
        run: |
          jq --arg version "$GITHUB_REF_NAME" '.version = $version | .packages[0].version = $version' server.json > server.json.tmp
          mv server.json.tmp server.json
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
      - name: Download and Verify mcp-publisher
        run: |
          version="v1.8.1"
          url="https://github.com/modelcontextprotocol/registry/releases/download/$version/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --remote-name "$url"
          curl --fail --location --remote-name "$url.sigstore.json"
          cosign verify-blob mcp-publisher_linux_amd64.tar.gz \
            --bundle mcp-publisher_linux_amd64.tar.gz.sigstore.json \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$version" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: Validate server.json  # the registry checks packages on pypi.org only, so a test release is not published
        run: ./mcp-publisher validate

  validate-mcp-bundle:
    name: Validate MCP Bundle manifest.json
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set Version in manifest.json
        run: |
          jq --arg version "$GITHUB_REF_NAME" '.version = $version' mcpb/manifest.json > mcpb/manifest.json.tmp
          mv mcpb/manifest.json.tmp mcpb/manifest.json
      - name: Validate manifest.json  # the bundle installs the package from pypi.org, so a test release is not packed
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate mcpb/manifest.json

  github-release:
    name: Create GitHub Release
    needs: [build, publish-docker-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force

          TAG_MSG=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")

          if [ -z "$TAG_MSG" ]; then
            TAG_MSG="Release $GITHUB_REF_NAME"
          fi

          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false 2>/dev/null || true

          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "$TAG_MSG" \
            --generate-notes \
            --prerelease
