name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '!*[a-zA-Z]*'  # ignore any tags that contain letters, this are test release tags

permissions:
  contents: read  # the default for every job; the jobs that publish set their own permissions

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/tests.yaml  # the full tests: every system and Python version, lint, package and Docker

  publish-docker-image:
    name: Publish Docker Image
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up QEMU  # emulates arm64 while building, so this amd64 runner also builds the arm64 image
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4  # initializes BuildKit engine required for gha cache backend

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.description=MCP server with weather forecasts, measurements, snow, the avalanche bulletin and sun and moon times for Switzerland

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64  # arm64 for Apple silicon Macs and Arm servers
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
          cache-from: type=gha  # pulls previous layers and uv cache from GitHub to speed up the build
          cache-to: type=gha,mode=max  # exports new layers and uv cache to GitHub for subsequent runs

  build:
    name: Build Distribution
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.ref_name }}  # the pushed tag is the version, whatever other tags share its commit
      - name: Store Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/swiss-weather-mcp
    permissions:
      id-token: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-mcp-registry:
    name: Publish to MCP Registry
    needs: publish-to-pypi  # the registry checks the package on PyPI, so it has to be there first
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # lets mcp-publisher log in to the registry as this repository
    steps:
      - name: Wait for the Version on PyPI  # the registry checks PyPI, which can show a new upload only after a while
        run: |
          for attempt in $(seq 12); do
            curl --fail --silent --output /dev/null "https://pypi.org/pypi/swiss-weather-mcp/$GITHUB_REF_NAME/json" && exit 0
            sleep 30
          done
          exit 1
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Set Version in server.json
        run: |
          jq --arg version "$GITHUB_REF_NAME" '.version = $version | .packages[0].version = $version' server.json > server.json.tmp
          mv server.json.tmp server.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Download and Verify mcp-publisher
        run: |
          version="v1.8.1"
          url="https://github.com/modelcontextprotocol/registry/releases/download/$version/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --remote-name "$url"
          curl --fail --location --remote-name "$url.sigstore.json"
          cosign verify-blob mcp-publisher_linux_amd64.tar.gz \
            --bundle mcp-publisher_linux_amd64.tar.gz.sigstore.json \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$version" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  github-release:
    name: Create GitHub Release
    needs: [build, publish-docker-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force

          TAG_MSG=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")

          if [ -z "$TAG_MSG" ]; then
            TAG_MSG="Release $GITHUB_REF_NAME"
          fi

          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false 2>/dev/null || true

          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "$TAG_MSG" \
            --generate-notes \
            --latest=false  # add-mcp-bundle marks it latest once the bundle is in, so releases/latest/download/ always has one

  add-mcp-bundle:
    name: Add MCP Bundle to the GitHub Release
    needs: [publish-to-pypi, github-release]  # the bundle installs the package from PyPI, and goes into the existing release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Wait for the Wheel on PyPI  # uv lock reads the simple index, whose HTML and JSON forms are cached apart
        run: |
          wheel="swiss_weather_mcp-$GITHUB_REF_NAME-py3-none-any.whl"
          url="https://pypi.org/simple/swiss-weather-mcp/"
          for attempt in $(seq 12); do
            if curl --fail --silent "$url" | grep --quiet "$wheel" \
              && curl --fail --silent --header "Accept: application/vnd.pypi.simple.v1+json" "$url" | grep --quiet "$wheel"; then
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Set Version in the Bundle
        run: |
          jq --arg version "$GITHUB_REF_NAME" '.version = $version' mcpb/manifest.json > mcpb/manifest.json.tmp
          mv mcpb/manifest.json.tmp mcpb/manifest.json
          sed -i "s/\"swiss-weather-mcp==0\\.0\\.0\"/\"swiss-weather-mcp==$GITHUB_REF_NAME\"/" mcpb/pyproject.toml
      - name: Pin Dependencies to the Tested Versions  # the versions of the release's uv.lock, which the tests ran with
        run: |
          {
            echo ""
            echo "[tool.uv]"
            echo "constraint-dependencies = ["
            uv export --frozen --no-dev --no-emit-project --no-hashes --no-header --no-annotate | sed 's/.*/    "&",/'
            echo "]"
          } >> mcpb/pyproject.toml
          uv lock --directory mcpb
      - name: Validate and Pack the Bundle  # one file name for all releases, so releases/latest/download/ always finds it
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 validate mcpb/manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack mcpb swiss-weather-mcp.mcpb
      - name: Add the Bundle to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" swiss-weather-mcp.mcpb --clobber
          gh release edit "$GITHUB_REF_NAME" --latest
