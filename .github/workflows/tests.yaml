name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read  # the jobs only read the code, so the token gets no write access

jobs:
  test:
    name: Pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # report every system and version, rather than cancel the rest after one failure
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]  # the bundle declares macOS and Windows, mcpb/manifest.json
        python-version: ["3.11", "3.12", "3.13", "3.14"]  # keep in line with the classifiers in pyproject.toml
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Dependencies
        run: uv sync --locked --group dev
      - name: Run Pytest
        run: uv run pytest --cov=swiss_weather_mcp --cov-fail-under=90  # the tests cover 94 % today

  lint-and-types:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"  # the lowest supported version
          enable-cache: true
      - name: Install Dependencies
        run: uv sync --locked --group dev --extra client  # mypy also checks the client, which imports the OpenAI SDK
      - name: Run Ruff
        run: uv run ruff check
      - name: Run Mypy
        run: uv run mypy

  package-test:
    name: Package Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # hatch-vcs reads the version from the git tags
      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"  # the lowest supported version
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build  # builds the wheel from the sdist, so a file missing from the sdist fails here
      # Only the built wheel is installed, in an environment of its own, as a user gets it
      - name: Start the installed server
        run: uv run --isolated --no-project --with dist/*.whl swiss-weather-mcp --help
      - name: Read the data file of the installed package
        run: >-
          uv run --isolated --no-project --with dist/*.whl python -c
          "from importlib import resources;
          resources.files('swiss_weather_mcp.places').joinpath('english_place_names.csv').read_text(encoding='utf-8')"

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build Docker image
        run: docker build -t swiss-weather-mcp-ci-image .
